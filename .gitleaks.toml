# gitleaks configuration — extend the built-in ruleset, allowlist documented non-secrets.
# https://github.com/gitleaks/gitleaks#configuration
# Known historical findings are ignored one by one, by fingerprint, in .gitleaksignore.
[extend]
useDefault = true

# The built-in rules miss a shell assignment such as `PGPASSWORD="..." pg_dump ...`.
# A value that starts with `$`, `{`, `<` or a backtick (a variable, a template or a
# placeholder) is not matched.
[[rules]]
id = "pgpassword-assignment"
description = "PostgreSQL password in a shell PGPASSWORD= assignment"
regex = '''\bPGPASSWORD\s*=\s*["']?([^\s"'$`<>{}]{6,})'''
secretGroup = 1
keywords = ["pgpassword"]

# MUST be the singular [allowlist], not the [[allowlists]] array: with `extend.useDefault`,
# gitleaks 8.24.3 silently IGNORES the array form, so this allowlist did nothing at all and the
# scheduled full-history scan failed on a historical finding. Verified on the exact CI image
# (ghcr.io/gitleaks/gitleaks:v8.24.3, full-history `detect`): [allowlist] -> "no leaks found",
# [[allowlists]] -> "leaks found: 1". The PR-scoped scans never caught this because they only
# read the diff, where these paths never appear.
# No path is allowlisted: an `.env.example` is scanned like any other file.
[allowlist]
description = "Synthetic test literals (not credentials)"
# Exact synthetic literal from the bot/API integration fixture
# (packages/bot/tests/test_web_login.py); a test value, not a credential.
regexes = [
  '''^synthetic-buyer-key-at-least-32-bytes$''',
]
