name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.kimi/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-recovery:
    name: Shop release recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exercise release traps and artifact recovery
        run: python -B -m unittest discover -s ops/tests -p test_shop_release_assets.py -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  admin:
    name: Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel-v2

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-panel-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API (FastAPI, PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/api

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_ci
          POSTGRES_DB: biotact_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://biotact:biotact_ci@localhost:5432/biotact_test_db
      S1_TEST_DATABASE_URL: postgresql://biotact:biotact_ci@localhost:5432/postgres
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      TELEGRAM_BOT_TOKEN: fake-token-for-ci
      TELEGRAM_CHAT_ID: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/test_category_schema_migration.py tests/test_optional_telegram_consumers.py alembic/versions/b7e31c904a62_category_purchase_flag_invariant.py

      - name: Format check with ruff
        run: ruff format --check src/ tests/test_category_schema_migration.py tests/test_optional_telegram_consumers.py alembic/versions/b7e31c904a62_category_purchase_flag_invariant.py

      - name: Check release asset helper
        run: |
          ruff check --config pyproject.toml ../../ops/shop-release-assets.py ../../ops/tests/test_shop_release_assets.py
          ruff format --check --config pyproject.toml ../../ops/shop-release-assets.py ../../ops/tests/test_shop_release_assets.py
          mypy --strict --ignore-missing-imports ../../ops/shop-release-assets.py

      - name: Type check with mypy
        run: mypy src/ --strict --ignore-missing-imports

      - name: Test API with pytest
        if: matrix.postgres == 17
        run: pytest tests/ -v --no-header

      - name: Test shared category and optional Telegram contracts on production PostgreSQL major
        if: matrix.postgres == 16
        run: pytest tests/test_category_schema_migration.py tests/test_optional_telegram_consumers.py -v --no-header

  migration-parity:
    name: Migration parity (PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_ci
          POSTGRES_DB: biotact_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://biotact:biotact_ci@localhost:5432/biotact_parity
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      TELEGRAM_BOT_TOKEN: fake-token-for-ci
      TELEGRAM_CHAT_ID: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Гейт против рассинхрона модель↔миграция (spec Этап 0 / урок инцидента #30):
      # на ЧИСТОЙ БД строим схему из миграций и сверяем с моделями.
      - name: Build schema from migrations
        run: alembic upgrade head

      - name: Check model-migration parity
        run: alembic check

      # Round-trip: каждая миграция обязана чисто откатываться и накатываться заново
      # (ловит утечку объектов, не дропнутых в downgrade — напр. PG enum orderstatus, PR-C).
      # Бьёт по DR/dev-reset до того, как это всплывёт в бою. Финальный check — parity после re-upgrade.
      - name: Migration round-trip (downgrade base → re-upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  bot:
    name: Bot (aiogram)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/bot

    env:
      BOT_TOKEN: "0000000000:AAFakeTokenForCITestingOnly1234567"
      BOT_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check bot/

      - name: Format check with ruff
        run: ruff format --check bot/

      # TODO: enable mypy after fixing aiogram InaccessibleMessage types
      # - name: Type check with mypy
      #   run: |
      #     pip install mypy
      #     mypy bot/ --strict --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v --no-header
