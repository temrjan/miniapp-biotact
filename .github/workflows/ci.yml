name: CI

on:
  push:
    branches: [main]
    # Documentation only; keep equal to the no-job rules in .github/scripts/ci-changes.py.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - '.kimi/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job below runs only when the change touches its inputs. Push runs compare
  # against the newest successful push run on main, so Deploy never follows a run
  # that skipped untested code. A gate tests != 'false', so a missing output runs the job.
  changes:
    name: Changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list earlier CI runs on main (push only)
    outputs:
      release_recovery: ${{ steps.detect.outputs.release_recovery }}
      frontend: ${{ steps.detect.outputs.frontend }}
      admin: ${{ steps.detect.outputs.admin }}
      api: ${{ steps.detect.outputs.api }}
      migration_parity: ${{ steps.detect.outputs.migration_parity }}
      bot: ${{ steps.detect.outputs.bot }}
      telegram_bot_api: ${{ steps.detect.outputs.telegram_bot_api }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select the jobs whose inputs changed
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'push' }}
        run: python -B .github/scripts/ci-changes.py "$MODE"

  release-recovery:
    name: Shop release recovery
    needs: changes
    if: needs.changes.outputs.release_recovery != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exercise release traps and artifact recovery
        run: python -B -m unittest discover -s ops/tests -p test_shop_release_assets.py -v

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  admin:
    name: Admin Panel
    needs: changes
    if: needs.changes.outputs.admin != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel-v2

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-panel-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API (FastAPI, PostgreSQL 16)
    needs: changes
    if: needs.changes.outputs.api != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/api

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16@sha256:6d5c7b5aa3eb2098a2365f6d8cff723fded9e0e680757908b0b144b47f9c069c
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_ci
          POSTGRES_DB: biotact_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://biotact:biotact_ci@localhost:5432/biotact_test_db
      S1_TEST_DATABASE_URL: postgresql://biotact:biotact_ci@localhost:5432/postgres
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      TELEGRAM_BOT_TOKEN: fake-token-for-ci
      TELEGRAM_CHAT_ID: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/consultant_doubles.py tests/test_consultant_enigma_*.py tests/test_consultant_token.py tests/test_consultant_provider.py tests/test_consultant_journal.py alembic/versions/8d1b1791159b_consultant_journal.py tests/test_category_schema_migration.py tests/test_optional_telegram_consumers.py alembic/versions/b7e31c904a62_category_purchase_flag_invariant.py tests/test_buyer_auth*.py tests/test_buyer_telegram*.py tests/tg1_browser_server.py alembic/versions/c4f2a91e8d63_buyer_email_sessions.py alembic/versions/d8a14f90bc21_buyer_telegram_requests.py alembic/versions/b4f4c51eb14a_guest_orders.py tests/test_guest_checkout.py tests/test_guest_order_migration.py tests/g1_browser_server.py alembic/versions/87688cb444f4_event_promotions.py scripts/event_promotions.py tests/test_event_promotions*.py alembic/versions/c8f2b4a91e30_video_banners_media_columns.py tests/test_video_banners.py

      - name: Format check with ruff
        run: ruff format --check src/ tests/consultant_doubles.py tests/test_consultant_enigma_*.py tests/test_consultant_token.py tests/test_consultant_provider.py tests/test_consultant_journal.py alembic/versions/8d1b1791159b_consultant_journal.py tests/test_category_schema_migration.py tests/test_optional_telegram_consumers.py alembic/versions/b7e31c904a62_category_purchase_flag_invariant.py tests/test_buyer_auth*.py tests/test_buyer_telegram*.py tests/tg1_browser_server.py alembic/versions/c4f2a91e8d63_buyer_email_sessions.py alembic/versions/d8a14f90bc21_buyer_telegram_requests.py alembic/versions/b4f4c51eb14a_guest_orders.py tests/test_guest_checkout.py tests/test_guest_order_migration.py tests/g1_browser_server.py alembic/versions/87688cb444f4_event_promotions.py scripts/event_promotions.py tests/test_event_promotions*.py alembic/versions/c8f2b4a91e30_video_banners_media_columns.py tests/test_video_banners.py

      - name: Check release asset helper
        run: |
          ruff check --config pyproject.toml ../../ops/shop-release-assets.py ../../ops/tests/test_shop_release_assets.py
          ruff format --check --config pyproject.toml ../../ops/shop-release-assets.py ../../ops/tests/test_shop_release_assets.py
          mypy --strict --ignore-missing-imports ../../ops/shop-release-assets.py

      - name: Type check with mypy
        run: mypy src/ --strict --ignore-missing-imports

      - name: Test API with pytest
        run: pytest tests/ -v --no-header

  migration-parity:
    name: Migration parity (PostgreSQL 16)
    needs: changes
    if: needs.changes.outputs.migration_parity != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16@sha256:6d5c7b5aa3eb2098a2365f6d8cff723fded9e0e680757908b0b144b47f9c069c
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_ci
          POSTGRES_DB: biotact_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://biotact:biotact_ci@localhost:5432/biotact_parity
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      TELEGRAM_BOT_TOKEN: fake-token-for-ci
      TELEGRAM_CHAT_ID: "0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Гейт против рассинхрона модель↔миграция (spec Этап 0 / урок инцидента #30):
      # на ЧИСТОЙ БД строим схему из миграций и сверяем с моделями.
      - name: Build schema from migrations
        run: alembic upgrade head

      - name: Check model-migration parity
        run: alembic check

      # Round-trip: каждая миграция обязана чисто откатываться и накатываться заново
      # (ловит утечку объектов, не дропнутых в downgrade — напр. PG enum orderstatus, PR-C).
      # Бьёт по DR/dev-reset до того, как это всплывёт в бою. Финальный check — parity после re-upgrade.
      - name: Migration round-trip (downgrade base → re-upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  bot:
    name: Bot (aiogram)
    needs: changes
    if: needs.changes.outputs.bot != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/bot

    env:
      BOT_TOKEN: "0000000000:AAFakeTokenForCITestingOnly1234567"
      BOT_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff==0.17.3
          ruff check bot/ tests/test_web_login.py tests/test_event_promotions.py

      - name: Format check with ruff
        run: ruff format --check bot/ tests/test_web_login.py tests/test_event_promotions.py

      # TODO: enable mypy after fixing aiogram InaccessibleMessage types
      # - name: Type check with mypy
      #   run: |
      #     pip install mypy
      #     mypy bot/ --strict --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v --no-header

  telegram-bot-api:
    name: Telegram bot, API and PostgreSQL 16
    needs: changes
    if: needs.changes.outputs.telegram_bot_api != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16@sha256:6d5c7b5aa3eb2098a2365f6d8cff723fded9e0e680757908b0b144b47f9c069c
        env:
          POSTGRES_USER: biotact
          POSTGRES_PASSWORD: biotact_ci
          POSTGRES_DB: biotact_test_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://biotact:biotact_ci@127.0.0.1:5432/biotact_test_db
      S1_TEST_DATABASE_URL: postgresql://biotact:biotact_ci@127.0.0.1:5432/postgres
      SECRET_KEY: ci-test-secret-key-not-for-production
      SENTRY_DSN: ''
      BOT_TOKEN: '0000000000:AAFakeTokenForCITestingOnly1234567'
      BOT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TG1_API_INTEGRATION: '1'
    defaults:
      run:
        working-directory: packages/bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the API and explicit bot integration dependencies
        run: pip install -r ../api/requirements.txt aiogram==3.23.0 redis==7.1.0
      - name: Exercise the actual dispatcher, Redis, API and SQL
        run: PYTHONPATH="$GITHUB_WORKSPACE/packages/api:$GITHUB_WORKSPACE/packages/bot" pytest tests/test_web_login.py tests/test_event_promotions.py -v --no-header
