name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Verify deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          for secret in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            value="${!secret}"
            if [ -z "$value" ]; then
              missing="$missing $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'SCRIPT'
          set -e
          cd /var/www/biotact

          echo "=== Save current revision for rollback ==="
          PREV_COMMIT=$(git rev-parse HEAD)
          G6_CUTOVER=false
          # Stop affected writers before replacing source or backfilling retained jobs.
          pm2 stop api --namespace biotact
          if pm2 pid employee-referral-worker --namespace biotact | awk '$1+0>0 {found=1} END {exit !found}'; then
            pm2 stop employee-referral-worker --namespace biotact
          fi
          rollback_referrals() {
            trap - ERR
            cd /var/www/biotact
            if [ -f ops/employee-referral-release.sh ]; then
              bash ops/employee-referral-release.sh rollback "$PREV_COMMIT" "$G6_CUTOVER"
            elif [ "$G6_CUTOVER" = "false" ]; then
              # A fetch failure on first install still has the previous checkout.
              git reset --hard "$PREV_COMMIT"
              pm2 restart api --namespace biotact --update-env
              pm2 save
            else
              echo "Referral rollback unavailable; affected writers remain paused"
              return 1
            fi
          }
          trap 'rollback_referrals; exit 1' ERR

          echo "=== Pull latest code ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Build frontend ==="
          cd packages/frontend
          npm ci --production=false
          npm run build
          cd ../..

          echo "=== Build admin panel ==="
          cd admin-panel-v2
          npm ci --production=false
          npm run build
          cd ..

          echo "=== Update API dependencies and run migrations ==="
          cd packages/api
          source venv/bin/activate
          pip install -r requirements.txt --quiet

          set +e
          trap - ERR
          G6_CUTOVER=true
          alembic upgrade head
          MIGRATION_STATUS=$?
          set -e
          trap 'rollback_referrals; exit 1' ERR

          if [ "$MIGRATION_STATUS" -ne 0 ]; then
            echo "=== Migration failed, aborting deploy and rolling back code ==="
            deactivate
            cd ../..
            rollback_referrals
            echo "=== Deploy aborted ==="
            exit 1
          fi

          deactivate
          cd ../..

          echo "=== Update Bot dependencies ==="
          cd packages/bot
          source venv/bin/activate
          pip install -r requirements.txt --quiet
          deactivate
          cd ../..

          echo "=== Restart services ==="
          bash ops/employee-referral-release.sh start
          pm2 restart bot --namespace biotact
          pm2 save

          echo "=== Health check ==="
          sleep 5
          set +e
          HEALTH_OK=true
          curl -fsS --max-time 10 http://127.0.0.1:3001/health >/dev/null || HEALTH_OK=false
          curl -fsS --max-time 10 http://127.0.0.1:3001/api/v1/products >/dev/null || HEALTH_OK=false
          set -e

          if [ "$HEALTH_OK" != "true" ]; then
            echo "=== Health check failed, rolling back code and rebuilds ==="
            rollback_referrals

            echo "=== Rebuild frontend from previous revision ==="
            cd packages/frontend
            npm ci --production=false
            npm run build
            cd ../..

            echo "=== Rebuild admin panel from previous revision ==="
            cd admin-panel-v2
            npm ci --production=false
            npm run build
            cd ..

            bash ops/employee-referral-release.sh check
            pm2 restart bot --namespace biotact
            echo "=== Rollback complete ==="
            exit 1
          fi

          bash ops/employee-referral-release.sh check
          trap - ERR
          echo "=== Deploy complete ==="
          SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
