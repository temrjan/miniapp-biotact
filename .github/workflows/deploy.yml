name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Verify deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          for secret in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            value="${!secret}"
            if [ -z "$value" ]; then
              missing="$missing $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'SCRIPT'
          set -e
          cd /var/www/biotact

          echo "=== Save current revision for rollback ==="
          PREV_COMMIT=$(git rev-parse HEAD)
          TARGET_COMMIT='${{ github.event.workflow_run.head_sha }}'
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          # A queued run must deliver its successful CI revision, not a later main.
          git fetch origin "$TARGET_COMMIT"
          test ! -L .venv
          mkdir -p .venv
          ASSET_HELPER=$(mktemp "$PWD/.venv/shop-assets-helper.XXXXXX.py")
          git show "$TARGET_COMMIT:ops/shop-release-assets.py" > "$ASSET_HELPER"
          BASE_ASSETS=$(python3 -B "$ASSET_HELPER" capture --project "$PWD" --commit "$PREV_COMMIT")
          mv "$ASSET_HELPER" "$BASE_ASSETS/helper.py"
          ASSET_HELPER="$BASE_ASSETS/helper.py"
          G6_CUTOVER=false
          guard=/usr/local/sbin/biotact-referral-maintenance
          test -x "$guard"
          maintenance_token=$(/usr/bin/python3 -c 'import uuid; print(uuid.uuid4().hex)')
          GUARD_STARTED=false
          ROLLBACK_ATTEMPTED=false
          rollback_referrals() {
            trap - ERR
            ROLLBACK_ATTEMPTED=true
            sudo -n -- "$guard" pause shop "$maintenance_token" || return 1
            cd /var/www/biotact || return 1
            bash ops/employee-referral-release.sh pause || return 1
            sudo -n -- "$guard" compatible shop "$maintenance_token" "$PREV_COMMIT" || return 1
            # Git cannot restore ignored dist trees. Restore BOTH before old API starts.
            python3 -B "$ASSET_HELPER" restore --project "$PWD" --snapshot "$BASE_ASSETS" || return 1
            if [ -f ops/employee-referral-release.sh ]; then
              bash ops/employee-referral-release.sh rollback "$PREV_COMMIT" "$G6_CUTOVER" || return 1
            elif [ "$G6_CUTOVER" = "false" ]; then
              # A fetch failure on first install still has the previous checkout.
              git reset --hard "$PREV_COMMIT"
              pm2 restart api --namespace biotact --update-env
              pm2 save
            else
              echo "Referral rollback unavailable; affected writers remain paused"
              return 1
            fi
            pm2 restart bot --namespace biotact || return 1
            pm2 save || return 1
            sudo -n -- "$guard" finish shop "$maintenance_token" || return 1
            python3 -B "$ASSET_HELPER" resolved --project "$PWD" --snapshot "$BASE_ASSETS" || return 1
            GUARD_STARTED=false
          }
          cleanup_deploy() {
            status=$?
            trap - EXIT ERR
            if [ "$GUARD_STARTED" = true ] && [ "$ROLLBACK_ATTEMPTED" = false ]; then
              rollback_referrals || status=1
            fi
            exit "$status"
          }
          trap cleanup_deploy EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          sudo -n -- "$guard" begin shop "$maintenance_token" "$$"
          GUARD_STARTED=true
          # Attest the baseline before retaining it as successful. Never prune here.
          bash ops/employee-referral-release.sh check
          curl -fsS --max-time 10 http://127.0.0.1:3001/health >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:3001/api/v1/products >/dev/null
          python3 -B "$ASSET_HELPER" success --project "$PWD" --snapshot "$BASE_ASSETS"
          # Admission closes and drains delivery before any writer/receiver stop.
          pm2 stop api --namespace biotact
          if pm2 pid employee-referral-worker --namespace biotact | awk '$1+0>0 {found=1} END {exit !found}'; then
            pm2 stop employee-referral-worker --namespace biotact
          fi
          trap 'rollback_referrals; exit 1' ERR

          echo "=== Pull latest code ==="
          git reset --hard "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

          echo "=== Build frontend ==="
          cd packages/frontend
          npm ci --production=false
          npm run build
          cd ../..

          echo "=== Build admin panel ==="
          cd admin-panel-v2
          npm ci --production=false
          npm run build
          cd ..

          echo "=== Update API dependencies and run migrations ==="
          cd packages/api
          source venv/bin/activate
          # Verify the fixed wheel before executing pip, including in old environments.
          bootstrap_dir=$(mktemp -d "$PWD/venv/tls-bootstrap.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl \
            --output "$bootstrap_dir/pip-26.2.2-py3-none-any.whl"
          printf '%s  %s\n' fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70 \
            "$bootstrap_dir/pip-26.2.2-py3-none-any.whl" | sha256sum --check --strict
          PYTHONPATH="$bootstrap_dir/pip-26.2.2-py3-none-any.whl" python -m pip --isolated install \
            --no-index --no-deps --no-cache-dir --upgrade "$bootstrap_dir/pip-26.2.2-py3-none-any.whl"
          pip install -r requirements.txt --quiet

          set +e
          trap - ERR
          G6_CUTOVER=true
          alembic upgrade head
          MIGRATION_STATUS=$?
          set -e
          trap 'rollback_referrals; exit 1' ERR

          if [ "$MIGRATION_STATUS" -ne 0 ]; then
            echo "=== Migration failed, aborting deploy and rolling back code ==="
            deactivate
            cd ../..
            rollback_referrals
            echo "=== Deploy aborted ==="
            exit 1
          fi

          deactivate
          cd ../..

          echo "=== Update Bot dependencies ==="
          cd packages/bot
          source venv/bin/activate
          # Verify the fixed wheel before executing pip, including in old environments.
          bootstrap_dir=$(mktemp -d "$PWD/venv/tls-bootstrap.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl \
            --output "$bootstrap_dir/pip-26.2.2-py3-none-any.whl"
          printf '%s  %s\n' fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70 \
            "$bootstrap_dir/pip-26.2.2-py3-none-any.whl" | sha256sum --check --strict
          PYTHONPATH="$bootstrap_dir/pip-26.2.2-py3-none-any.whl" python -m pip --isolated install \
            --no-index --no-deps --no-cache-dir --upgrade "$bootstrap_dir/pip-26.2.2-py3-none-any.whl"
          pip install -r requirements.txt --quiet
          deactivate
          cd ../..

          echo "=== Restart services ==="
          bash ops/employee-referral-release.sh start
          pm2 restart bot --namespace biotact
          pm2 save

          echo "=== Health check ==="
          sleep 5
          set +e
          HEALTH_OK=true
          curl -fsS --max-time 10 http://127.0.0.1:3001/health >/dev/null || HEALTH_OK=false
          curl -fsS --max-time 10 http://127.0.0.1:3001/api/v1/products >/dev/null || HEALTH_OK=false
          set -e

          if [ "$HEALTH_OK" != "true" ]; then
            echo "=== Health check failed, rolling back code and rebuilds ==="
            rollback_referrals

            # Exact saved builds were restored before the prior API/worker resumed.
            bash ops/employee-referral-release.sh check
            echo "=== Rollback complete ==="
            exit 1
          fi

          bash ops/employee-referral-release.sh check
          CURRENT_ASSETS=$(python3 -B "$ASSET_HELPER" capture --project "$PWD" --commit "$TARGET_COMMIT")
          sudo -n -- "$guard" finish shop "$maintenance_token"
          GUARD_STARTED=false
          trap - ERR EXIT INT TERM
          # Cleanup is allowed only after actual release acceptance; unresolved attempts stay.
          python3 -B "$ASSET_HELPER" success --project "$PWD" --snapshot "$CURRENT_ASSETS" --prune
          echo "=== Deploy complete ==="
          SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
