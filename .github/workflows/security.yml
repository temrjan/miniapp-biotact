name: Security

# Separate from CI so it never touches the CI -> Deploy (workflow_run) chain.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly (Mon 04:00 UTC): catches new advisories against unchanged code.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Dependency audits block on unapproved vulnerabilities and expired entries in
# .github/security-exceptions.json. Pull requests run only the audits whose
# inputs changed (fail-closed to all four targets on unknown or shared security
# files); push, schedule, and workflow_dispatch run all four audits.
jobs:
  changes:
    name: Changed audit targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      bot: ${{ steps.scope.outputs.bot }}
      frontend: ${{ steps.scope.outputs.frontend }}
      admin: ${{ steps.scope.outputs.admin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select the dependency audits whose inputs changed
        id: scope
        run: python -B .github/scripts/security-audit.py scope --head HEAD

  pip-audit-api:
    name: pip-audit (API)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.api != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit API Python dependencies
        run: python -B .github/scripts/security-audit.py pip --target packages/api/requirements.txt --exceptions .github/security-exceptions.json

  pip-audit-bot:
    name: pip-audit (Bot)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.bot != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit Bot Python dependencies
        run: python -B .github/scripts/security-audit.py pip --target packages/bot/requirements.txt --exceptions .github/security-exceptions.json

  npm-audit-frontend:
    name: npm audit (Frontend)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Audit Frontend Node dependencies
        run: python -B .github/scripts/security-audit.py npm --target packages/frontend --exceptions .github/security-exceptions.json

  npm-audit-admin:
    name: npm audit (Admin Panel)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.admin != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Audit Admin Panel Node dependencies
        run: python -B .github/scripts/security-audit.py npm --target admin-panel-v2 --exceptions .github/security-exceptions.json

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits via the API on pull_request
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans git history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
