name: Security

# Separate from CI so it never touches the CI -> Deploy (workflow_run) chain.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly (Mon 04:00 UTC): catches new advisories against unchanged code.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# PHASE 1. Dependency audits are REPORT-ONLY: a step-level `continue-on-error`
# keeps the job green while pre-existing advisories (many today) are logged, not
# alarming. Triage in a follow-up, then drop continue-on-error to make them block
# (PR-scoped). gitleaks is NOT silenced — the repo is clean so it stays green; a
# newly committed secret turns it red (visible; non-blocking until it's required).
jobs:
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - packages/api/requirements.txt
          - packages/bot/requirements.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        continue-on-error: true # Phase 1: report-only
        with:
          inputs: ${{ matrix.requirements }}

  npm-audit:
    name: npm audit (Node deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir:
          - packages/frontend
          - admin-panel-v2
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # Fails only on high/critical; --omit=dev drops devDependency noise.
      - run: npm audit --audit-level=high --omit=dev
        continue-on-error: true # Phase 1: report-only

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits via the API on pull_request
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks scans git history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
