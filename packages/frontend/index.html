<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>biotact</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root {
        background-color: #f8f6f2;
        min-height: 100vh;
        margin: 0;
      }
      #root {
        padding-top: var(--tg-header-height, 0px);
      }
    </style>
    <script>
      (function() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        var platform = tg.platform;
        var isMobile = platform === 'ios' || platform === 'android' || platform === 'android_x';
        if (!isMobile) return;

        var viewportHeight = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
        var screenHeight = window.screen.height;
        var ratio = viewportHeight / screenHeight;

        // Fullscreen (Open button): ratio >= 0.95
        // Sheet (inline button): ratio < 0.95
        var isFullscreenMode = ratio >= 0.95;

        if (isFullscreenMode) {
          document.documentElement.style.setProperty('--tg-header-height', '56px');
        } else {
          document.documentElement.style.setProperty('--tg-header-height', '0px');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
