<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      // Capture in a closure and remove every ref before resources, SDK or React start.
      (function () {
        var url = new URL(window.location.href);
        var entry = null;
        if (url.searchParams.has('ref')) {
          var values = url.searchParams.getAll('ref');
          url.searchParams.delete('ref');
          var location = url.pathname + url.search + url.hash;
          history.replaceState(history.state, '', location);
          entry = { values: values, location: location };
        }
        window.consumeBiotactReferral = function () {
          var current = entry;
          entry = null;
          return current;
        };
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>biotact</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root {
        background-color: #f5f7fa;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        /* Height will be set by JS via --app-height variable */
        height: var(--app-height, 100vh);
      }
    </style>
    <script>
      // Set initial app height before React loads
      (function() {
        var tg = window.Telegram && window.Telegram.WebApp;
        var height = (tg && (tg.viewportStableHeight || tg.viewportHeight)) || window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
        
        // Also set padding for Telegram header if needed
        if (tg) {
          var platform = tg.platform;
          var isMobile = platform === 'ios' || platform === 'android' || platform === 'android_x';
          if (isMobile) {
            var viewportHeight = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
            var screenHeight = window.screen.height;
            var ratio = viewportHeight / screenHeight;
            if (ratio >= 0.95) {
              document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', '56px');
            }
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
