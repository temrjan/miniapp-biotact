[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biotact-api"
version = "1.0.0"
description = "Biotact API - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Biotact Team"}
]

dependencies = [
    "fastapi==0.124.0",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy==2.0.45",
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "python-jose==3.5.0",
    "python-multipart==0.0.20",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "sentry-sdk==2.47.0",
    "aiofiles==25.1.0",
    "psycopg2-binary==2.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
api = "biotact_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biotact_api = ["py.typed"]

# ═══════════════════════════════════════════════════════════════════
# Ruff - Fast Python linter & formatter (замена flake8, isort, black)
# ═══════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "S101",   # assert used (ok in tests)
    "S104",   # binding to all interfaces (ok for containers)
    "S105",   # hardcoded password (false positives on field names)
    "S106",   # hardcoded password (false positives on field names)
    "RUF001", # ambiguous unicode (Cyrillic in Russian-language strings)
    "RUF003", # ambiguous unicode in comments (Cyrillic)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101", "S105", "S106", "S324"]  # S324: md5/sha1 mirror Multicard signatures
"alembic/**/*.py" = ["UP"]
"src/payments/service.py" = ["S324"]  # md5/sha1 required by Multicard API

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════════
# MyPy - Static type checker
# ═══════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
# Practical relaxations for FastAPI
allow_untyped_decorators = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════════════
# Pytest - Testing framework
# ═══════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

# ═══════════════════════════════════════════════════════════════════
# Coverage - Code coverage
# ═══════════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
