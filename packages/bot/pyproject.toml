[project]
name = "mistore-bot"
version = "1.0.0"
description = "MiStore Telegram Bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ═══════════════════════════════════════════════════════════════════
# Ruff - Fast Python linter & formatter
# ═══════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in defaults (aiogram patterns)
    "S101",   # assert used (ok in tests)
    "S110",   # try-except-pass (bot notification patterns)
    "SIM105", # contextlib.suppress (verbose but clear in bot handlers)
    "RUF001", # ambiguous unicode (Cyrillic in Russian-language strings)
    "RUF003", # ambiguous unicode in comments (Cyrillic)
    "RUF006", # asyncio.create_task without storing ref (fire-and-forget pattern)
    "RUF034", # useless if-else (localization placeholder)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════════
# MyPy - Static type checker
# ═══════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
